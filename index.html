<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>maaf ya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a1830; --soft:#8d4a68; --pink:#ff6fa5; --pink2:#e63e86;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif;color:var(--ink);
    background:#ff9cc2;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:linear-gradient(180deg,#ffe6f0 0%,#ffb3d1 45%,#f2579f 100%);
  }
  body.kecil, body.kecil *{text-transform:lowercase}
  .hidden{display:none!important}

  main{max-width:430px;margin:0 auto;padding:26px 22px 50px;min-height:100dvh;display:flex;flex-direction:column}

  /* progress */
  .hati{margin:6px 0 4px}
  .hati .row{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:8px}
  .track{height:11px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff9cc2,var(--pink2));transition:width 1.1s cubic-bezier(.4,0,.2,1)}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:in .7s ease both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* kartu pembuka */
  .card{
    background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.6);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-radius:26px;padding:26px 22px 22px;box-shadow:0 14px 40px rgba(180,40,100,.18);
  }
  h1{font-family:'Dancing Script',cursive;font-weight:600;font-size:2.5rem;margin:14px 0 8px;line-height:1.1}
  .txt{font-size:.95rem;line-height:1.65;margin:0 0 14px;color:var(--ink)}
  .card .txt{color:var(--soft)}
  .letter{text-align:left;margin:22px 4px 6px}
  .letter .txt{margin-bottom:16px}

  .photo{
    background:rgba(255,255,255,.5) center/cover no-repeat;display:grid;place-items:center;font-size:2.6rem;
    border-radius:20px;margin:0 auto;box-shadow:0 8px 24px rgba(180,40,100,.25);
  }
  .photo.big{width:min(62vw,230px);aspect-ratio:3/3.7}
  .photo.mid{width:min(54vw,210px);aspect-ratio:1;border-radius:50%;margin-top:24px;margin-bottom:22px}
  .photo.small{width:min(34vw,130px);aspect-ratio:1;border-radius:50%;margin-bottom:20px}

  .btn{
    display:block;width:100%;font:inherit;font-weight:600;font-size:1rem;color:#fff;border:0;cursor:pointer;
    padding:15px 20px;border-radius:16px;margin-top:10px;
    background:linear-gradient(135deg,#ff7db0,var(--pink2));
    box-shadow:0 8px 20px rgba(230,62,134,.35);transition:transform .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .btn.ghost{background:rgba(255,255,255,.55);color:var(--pink2);box-shadow:none}

  /* amplop */
  .env-wrap{perspective:700px;margin:40px auto 0;cursor:pointer}
  .env{position:relative;width:220px;height:150px;margin:0 auto;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .env .back{position:absolute;inset:0;border-radius:12px;background:#c43c72;box-shadow:0 14px 30px rgba(120,20,70,.35)}
  .env .paper{
    position:absolute;left:14px;right:14px;top:12px;height:120px;border-radius:8px;background:#fffafc;
    display:grid;place-items:center;text-align:center;padding:10px;z-index:1;
    font-family:'Dancing Script',cursive;font-size:1.35rem;color:var(--pink2);
    transition:transform 1s cubic-bezier(.4,0,.2,1) .35s;
  }
  .env .front{
    position:absolute;inset:0;border-radius:12px;z-index:2;
    background:linear-gradient(160deg,#ec5d90,#d6477c);
    clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
  }
  .env .flap{
    position:absolute;left:0;right:0;top:0;height:56%;z-index:3;transform-origin:top center;
    background:linear-gradient(180deg,#d9487f,#cc3d73);
    clip-path:polygon(0 0,100% 0,50% 100%);border-radius:12px 12px 0 0;
  }
  .env .seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;font-size:1.7rem;transition:opacity .3s}
  .env.open .flap{animation:flap .8s ease forwards}
  @keyframes flap{0%{transform:rotateX(0);z-index:3}49%{z-index:3}50%{z-index:0}100%{transform:rotateX(180deg);z-index:0}}
  .env.open .seal{opacity:0}
  .env.open .paper{transform:translateY(-58px)}
  .tap{font-size:.8rem;color:var(--soft);margin-top:26px}

  /* musik */
  .music{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0));right:12px;z-index:20;width:44px;height:44px;border-radius:50%;
    border:0;background:rgba(255,255,255,.75);font-size:1.15rem;cursor:pointer;box-shadow:0 4px 14px rgba(180,40,100,.25);
  }
  .music.playing{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* hati jatuh */
  #hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .h{position:absolute;bottom:-40px;animation:float linear forwards;will-change:transform}
  @keyframes float{
    0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
    10%{opacity:.9}
    100%{transform:translate3d(var(--dx),-112vh,0) rotate(var(--r));opacity:0}
  }

  /* popup */
  .modal{position:fixed;inset:0;z-index:30;background:rgba(74,24,48,.45);display:grid;place-items:center;padding:24px;animation:in .3s ease both}
  .box{background:#fff;border-radius:20px;padding:24px 22px 16px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .box p{margin:0 0 14px;line-height:1.6}
  .box button{border:0;background:none;color:var(--pink2);font:inherit;font-weight:600;cursor:pointer;padding:8px 14px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<audio id="bgm" loop preload="auto"></audio>
<button class="music hidden" id="musicBtn" aria-label="putar atau jeda lagu">🎵</button>
<div id="hearts"></div>

<main>
  <div class="hati hidden" id="hati">
    <div class="row"><span id="labelHati"></span><span id="persen">0%</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div id="stage"></div>
</main>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="box"><p id="popupTeks"></p><button id="tutupBtn"></button></div>
</div>

<script>
/* =====================================================
   ✏️ EDIT BAGIAN INI SAJA
   ===================================================== */
const CONFIG = {
  semuaHurufKecil: true,        // true = semua tulisan jadi huruf kecil, false = ikut yang kamu ketik
  nama: "sayang",               // panggilan dia

  // Lagu (upload mp3-nya ke repo, sebaris dengan file ini)
  lagu: "lagu.mp3",
  volume: 2,                    // 0 sampai 1
  penguat: 2.5,
  mulaiDetik: 0,                // mulai dari detik ke berapa

  labelHati: "hati kamu",

  // Kartu pembuka
  intro: {
    foto: "foto1.jpg",
    judul: "hi {nama}",
    teks: "tulis di sini kalimat pembukamu. singkat aja, yang penting jujur.",
    tombol: "buka surat 💌"
  },

  amplopTulisan: "untuk sayangku ❤",
  amplopHint: "tap amplopnya",

  // Tahap-tahap. Tiap tahap = satu layar. Boleh tambah/kurangi/ubah angka persennya.
  // Kalau "foto" dikosongkan (""), layarnya jadi layar surat panjang tanpa foto.
  // "teks" boleh satu kalimat atau beberapa paragraf (pakai tanda [ ]).
  tahap: [
    {
      persen: 25,
      foto: "foto2.jpg",
      teks: "akuuu mintaaa maaff yaa sudaaa buattt kamuuu nungguuu lamaaa.",
      tombol: "next 🤍"
    },
    {
      persen: 50,
      foto: "foto3.jpg",
      teks: "akuuu mintaaa maafff yaaa akuuu sudaaa lamaaa buattt nungguuu dannn jadiiinyaaa kamuuu badmooddd, akuuu sediii buattt kamuuu badmooddd akuuu ngerasaaa salahhh, akuuu harapppp dengannn surattt iniii kamuuuu bisaaa sedikitttt maaffinnn akuuu, mulaiii dariii sekaranggg akuuu bakalll lebiii hargainnn waktuuu buattt bisaaa barenggg kamuuu akuuu sayanggg samaaa kamuuu semogaaa kamuuu teteppp jadiii oranggg yangggg selaluuu sayanggg samaaa akuuu, ehehee meskipunnn akuuu sukaaa buattt kamuuu badmooddd.",
      tombol: "masih mau lanjut?"
    },
    {
      persen: 75,
      foto: "",
      teks: [
        "sayang...",
        "ehehee iniii akuuu cowooo yanggg selaluuu buattt kamuuu kesalll, akuuu mintaaa maafff yaaa buattt ituuu akuuu sudaaa salahhh karnaaa halll tadiii semogaaa kamuuu maaffinnn yaaa cintaaakuuu. akuuu sangatttt sayangggg samaaa kamuuu kalooo semisalll kamuuu badmooddd atauuu sediii ituuu akuuu selaluuu ngerasaaa sediii jugaaa, akuuuu mauuu jadiii yanggg terbaikkk buattt kamuuu tungguuu akuuu yaaa jadiii yanggg terbaikkk.",
        "akuuuu bakalll lebiii hargainnn waktuuu kamuuu sayangggg akuuu gamauuu ngebuanggg waktuuu berhargaaa dariii kamuuu, akuuu mintaaa maafff yaaa soalll tadiii.",
        "ehehe semogaaa dengannn kataaa kataaa maafff akuuu bisaaa buattt kamuuu luluhhh, dengannn rasaaa bersalahhhh akuuu mintaaa maafff yaaa sayangggg",
        "akuuu sayanggg kamuuu. selaluuu. 🤍"
      ],
      tombol: "aku janji berubah 🤍"
    }
  ],

  // Layar terakhir (100%)
  akhir: {
    foto: "foto1.jpg",
    teks: "terima kasih sudah baca semuanya. semoga abis ini kita bisa baikan. ❤️",
    tombolPeluk: "peluk virtual 🫂",
    tombolUlang: "ulangi 💗",
    popup: "makasih ya sayang... aku bakal berusaha jadi lebih baik. 🤍",
    tombolTutup: "tutup"
  }
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const fill = s => String(s).replace(/\{nama\}/g, CONFIG.nama);
if (CONFIG.semuaHurufKecil) document.body.classList.add('kecil');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = fill(text);
  return e;
}
function photo(src, cls){
  const d = el('div', 'photo ' + cls);
  const img = new Image();
  img.onload  = () => d.style.backgroundImage = 'url("' + src + '")';
  img.onerror = () => d.textContent = '📷';
  img.src = src;
  return d;
}
function paras(parent, teks){
  (Array.isArray(teks) ? teks : [teks]).forEach(t => parent.appendChild(el('p', 'txt', t)));
}
function btn(label, cls, fn){
  const b = el('button', 'btn ' + (cls || ''), label);
  b.onclick = fn;
  return b;
}

/* ---------- hati jatuh ---------- */
const heartBox = $('hearts');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const palette = ['#ff5c9d','#ff8fbd','#ffffff','#e63e86','#ffc2da'];
function spawnHeart(){
  if (reduce) return;
  const h = el('span', 'h', '♥');
  const size = 12 + Math.random() * 24;
  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = size + 'px';
  h.style.color = palette[Math.floor(Math.random() * palette.length)];
  h.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
  h.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
  h.style.animationDuration = (6 + Math.random() * 6) + 's';
  heartBox.appendChild(h);
  setTimeout(() => h.remove(), 12500);
}
setInterval(() => { if (heartBox.children.length < 22) spawnHeart(); }, 650);
function burst(n){ for (let i = 0; i < n; i++) setTimeout(spawnHeart, i * 70); }

/* ---------- progress ---------- */
const hati = $('hati'), fillEl = $('fill'), persenEl = $('persen');
$('labelHati').textContent = fill(CONFIG.labelHati);
let shown = 0, counter = null;
function setBar(p){
  hati.classList.toggle('hidden', p === null);
  if (p === null) return;
  fillEl.style.width = p + '%';
  clearInterval(counter);
  counter = setInterval(() => {
    if (shown === p) return clearInterval(counter);
    shown += shown < p ? 1 : -1;
    persenEl.textContent = shown + '%';
  }, 1100 / Math.max(1, Math.abs(p - shown)));
}

/* ---------- musik ---------- */
const bgm = $('bgm'), musicBtn = $('musicBtn');
function setPlaying(on){ musicBtn.classList.toggle('playing', on); musicBtn.textContent = on ? '🎵' : '🔇'; }
if (CONFIG.lagu) {
  bgm.src = CONFIG.lagu;
  musicBtn.onclick = () => {
    if (bgm.paused) { wake () ; bgm.volume= CONFIG.volume; bgm.play().then(() => setPlaying(true)).catch(() => {}); }
    else { bgm.pause(); setPlaying(false); }
  };
}
let actx = null;
function boost(){
  if (actx || !(CONFIG.penguat > 1)) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    const src = actx.createMediaElementSource(bgm);
    const gain = actx.createGain();
    gain.gain.value = CONFIG.penguat;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -8; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.2;
    src.connect(gain); gain.connect(comp); comp.connect(actx.destination);
  } catch(e) { actx = null; }
}
function wake(){ if (actx && actx.state === 'suspended') actx.resume(); }
function startMusic(){
  if (!CONFIG.lagu) return;
  boost(); wake();
  musicBtn.classList.remove('hidden');
  try { bgm.currentTime = CONFIG.mulaiDetik || 0; } catch(e) {}
  bgm.volume = 0;
  bgm.play().then(() => {
    setPlaying(true);
    let v = 0;
    const t = setInterval(() => {
      v = Math.min(CONFIG.volume, v + CONFIG.volume / 16);
      bgm.volume = v;
      if (v >= CONFIG.volume) clearInterval(t);
    }, 70);
  }).catch(() => setPlaying(false));
}

/* ---------- alur layar ---------- */
const stageBox = $('stage');
const T = CONFIG.tahap;
const LAST = T.length + 2;     // 0 intro, 1 amplop, 2..n tahap, LAST akhir
let step = 0, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function go(n){
  timers.forEach(clearTimeout); timers = [];
  step = n;
  const s = el('div', 'stage');
  stageBox.replaceChildren(s);
  window.scrollTo(0, 0);

  if (n === 0) {                                   // pembuka
    setBar(null);
    const c = el('div', 'card');
    if (CONFIG.intro.foto) c.appendChild(photo(CONFIG.intro.foto, 'big'));
    c.appendChild(el('h1', '', CONFIG.intro.judul));
    paras(c, CONFIG.intro.teks);
    c.appendChild(btn(CONFIG.intro.tombol, '', () => { startMusic(); go(1); }));
    s.appendChild(c);

  } else if (n === 1) {                            // amplop
    setBar(0);
    const wrap = el('div', 'env-wrap');
    wrap.innerHTML = '<div class="env" id="env"><div class="back"></div><div class="paper"></div><div class="front"></div><div class="flap"></div><div class="seal">❤️</div></div>';
    wrap.querySelector('.paper').textContent = fill(CONFIG.amplopTulisan);
    s.appendChild(wrap);
    s.appendChild(el('div', 'tap', CONFIG.amplopHint));
    const env = wrap.querySelector('#env');
    later(() => env.classList.add('open'), 900);
    later(() => go(2), 3400);
    wrap.onclick = () => { env.classList.add('open'); later(() => go(2), 1400); };

  } else if (n === LAST) {                         // akhir
    setBar(100); burst(40);
    const A = CONFIG.akhir;
    if (A.foto) s.appendChild(photo(A.foto, 'small'));
    paras(s, A.teks);
    s.appendChild(btn(A.tombolPeluk, '', () => {
      $('popupTeks').textContent = fill(A.popup);
      $('tutupBtn').textContent = fill(A.tombolTutup);
      $('modal').classList.remove('hidden'); burst(30);
    }));
    s.appendChild(btn(A.tombolUlang, 'ghost', () => { shown = 0; persenEl.textContent = '0%'; go(0); }));

  } else {                                         // tahap 25 / 50 / 75 ...
    const t = T[n - 2];
    setBar(t.persen);
    if (t.foto) {
      s.appendChild(photo(t.foto, 'mid'));
      paras(s, t.teks);
    } else {
      const l = el('div', 'letter'); paras(l, t.teks); s.appendChild(l);
    }
    s.appendChild(btn(t.tombol, '', () => go(n + 1)));
  }
}

$('tutupBtn').onclick = () => $('modal').classList.add('hidden');
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.add('hidden'); };

go(0);
</script>
</body>
</html>
